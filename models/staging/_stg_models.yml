version: 2

models:
  - name: stg_products
    description: Product catalog from raw_products, one row per product.
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: product_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['cash', 'pos']

  - name: stg_customers
    description: Customers, current state, one row per customer; NULL employment_type replaced with 'unknown'.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: employment_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['employed', 'self_employed', 'unemployed', 'unknown']
      - name: risk_segment
        data_tests:
          - accepted_values:
              arguments:
                values: ['low', 'medium', 'high']

  - name: stg_loan_applications
    description: Loan applications, one row per application; channel cleaned (lower, trim).
    columns:
      - name: application_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: campaign_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_campaigns')
                field: campaign_id
      - name: channel
        data_tests:
          - accepted_values:
              arguments:
                values: ['facebook', 'google', 'tiktok', 'partner_store', 'organic']
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['approved', 'rejected', 'cancelled']

  - name: stg_payments
    description: Customer payments, one row per payment; load duplicates removed (earliest _loaded_at kept).
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: loan_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_loans')
                field: loan_id
      - name: installment_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_installments')
                field: installment_id

  - name: stg_campaigns
    description: Marketing campaigns, one row per campaign.
    columns:
      - name: campaign_id
        data_tests: [unique, not_null]
      - name: channel
        data_tests:
          - accepted_values:
              arguments:
                values: ['facebook', 'google', 'tiktok', 'partner_store']

  - name: stg_marketing_spend
    description: Daily ad spend, one row per campaign and day.
    columns:
      - name: campaign_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_campaigns')
                field: campaign_id

  - name: stg_loans
    description: Disbursed loans, one row per loan; one loan per approved application.
    columns:
      - name: loan_id
        data_tests: [unique, not_null]
      - name: application_id
        data_tests:
          - unique
          - relationships:
              arguments:
                to: ref('stg_loan_applications')
                field: application_id
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['active', 'closed']

  - name: stg_installments
    description: Planned repayment schedule, one row per loan installment.
    columns:
      - name: installment_id
        data_tests: [unique, not_null]
      - name: loan_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_loans')
                field: loan_id

  - name: stg_provider_statement
    description: Payment provider statement, one row per provider transaction.
    columns:
      - name: provider_txn_id
        data_tests: [unique, not_null]
